<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Disponibilidades</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        @media print { body { margin: 15px; } }
    </style>
</head>
<body>
    <h2>Disponibilidades</h2>
    <table>
        <thead>
            <tr>
                <th>Bombeiro</th><th>Data</th><th>Categoria</th><th>Turno Extra</th><th>Confirmada</th>
            </tr>
        </thead>
        <tbody>
            {% for d in disponibilidades %}
            <tr>
                <td>{{ d.bombeiro.nome }}</td>
                <td>{{ d.data.strftime('%d/%m/%Y') }}</td>
                <td>{{ d.categoria or '-' }}</td>
                <td>{{ d.turno_extra or '-' }}</td>
                <td>{{ 'Sim' if d.confirmada else 'Não' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>window.print();</script>
</body>
</html>
