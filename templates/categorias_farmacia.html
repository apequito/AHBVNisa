{% extends "base.html" %}
{% block content %}
<h2>Categorias de Farmácia</h2>

<button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalNovaCategoria">+ Nova Categoria</button>

<table class="table table-bordered table-sm">
    <thead><tr><th>ID</th><th>Nome</th><th>Ação</th></tr></thead>
    <tbody>
        {% for cat in categorias %}
        <tr>
            <td>{{ cat.id }}</td>
            <td>{{ cat.nome }}</td>
            <td>
                <a href="{{ url_for('apagar_categoria_farmacia', id=cat.id) }}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Apagar esta categoria?')">🗑️</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="modal fade" id="modalNovaCategoria" tabindex="-1">
    <div class="modal-dialog">
        <form method="POST">
            <div class="modal-content">
                <div class="modal-header"><h5>Nova Categoria</h5></div>
                <div class="modal-body">
                    <input type="text" name="nome" class="form-control" placeholder="Nome da categoria" required>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="checklist" id="checklistBox">
                     <label class="form-check-label" for="checklistBox">Incluir no Checklist Ambulância</label>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-success">Criar</button></div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
