<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Stock Farmácia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        @media print { body { margin: 15px; } }
    </style>
</head>
<body>
    <h2>Stock Farmácia</h2>
    <table>
        <thead><tr><th>ID</th><th>Categoria</th><th>Nome</th><th>Tamanho</th><th>Stock</th><th>Última Atualização</th></tr></thead>
        <tbody>
            {% for i in itens %}
            <tr>
                <td>{{ i.id }}</td>
                <td>{{ i.categoria }}</td>
                <td>{{ i.nome }}</td>
                <td>{{ i.tamanho or '-' }}</td>
                <td>{{ i.stock }}</td>
                <td>{{ i.data_atualizacao.strftime('%d/%m/%Y %H:%M') if i.data_atualizacao else '-' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>window.print();</script>
</body>
</html>
