{% extends "base.html" %}
{% block content %}

<style>
    /* Estilos para os modais de ecrã inteiro */
    .modal-fullscreen .modal-content {
        height: 100vh;
        border: none;
        border-radius: 0;
    }
    .modal-fullscreen .modal-body {
        height: calc(100vh - 60px);
        padding: 0;
    }
    .modal-fullscreen iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    .card-closed {
        display: none;
    }
    .reopen-card {
        margin-top: 10px;
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-tv me-2"></i>Monitorização de Ocorrências</h2>
    <button class="btn btn-secondary" onclick="window.location.reload();">
        <i class="bi bi-arrow-repeat"></i> Atualizar Dados
    </button>
</div>

<div class="row g-4">
    <!-- 1. Fogos.pt - Incêndios Ativos (com filtro para Portalegre) -->
    <div class="col-md-6 monitor-card" id="card-fogos">
        <div class="card h-100 shadow-sm">
            <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-fire me-2"></i> Fogos.pt - Incêndios Ativos</span>
                <div>
                    <button class="btn btn-sm btn-light me-2 filter-portalegre" title="Filtrar para o distrito de Portalegre">
                        <i class="bi bi-geo-alt-fill"></i> Portalegre
                    </button>
                    <button class="btn btn-sm btn-light me-2 reset-map" title="Ver mapa completo de Portugal">
                        <i class="bi bi-map"></i> Portugal
                    </button>
                    <button class="btn btn-sm btn-light me-2 expand-card" title="Expandir">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                    <button class="btn btn-sm btn-light close-card" title="Fechar">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <iframe id="fogosFrame"
                        src="https://www.fogos.pt"
                        class="w-100 border-0"
                        style="height: 600px;"
                        title="Incêndios Ativos"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"
                        referrerpolicy="no-referrer">
                </iframe>
            </div>
            <div class="card-footer text-muted small">
                Fonte: <a href="https://www.fogos.pt" target="_blank">fogos.pt</a>
            </div>
        </div>
    </div>

    <!-- 2. fogos.online - Ocorrências Ativas de Proteção Civil -->
    <div class="col-md-6 monitor-card" id="card-fogos-online">
        <div class="card h-100 shadow-sm">
            <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                <span><i class="bi bi-exclamation-triangle me-2"></i> Ocorrências Ativas (fogos.online)</span>
                <div>
                    <button class="btn btn-sm btn-light me-2 expand-card" title="Expandir">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                    <button class="btn btn-sm btn-light close-card" title="Fechar">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <iframe src="https://fogos.online/occurrences/"
                        class="w-100 border-0"
                        style="height: 600px;"
                        title="Ocorrências Ativas"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                        referrerpolicy="no-referrer">
                </iframe>
            </div>
            <div class="card-footer text-muted small">
                Fonte: <a href="https://fogos.online" target="_blank">fogos.online</a>
            </div>
        </div>
    </div>

    <!-- 3. Bombeiros.pt - Ocorrências -->
    <div class="col-md-6 monitor-card" id="card-bombeiros">
        <div class="card h-100 shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-truck me-2"></i> Bombeiros.pt - Ocorrências</span>
                <div>
                    <button class="btn btn-sm btn-light me-2 expand-card" title="Expandir">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                    <button class="btn btn-sm btn-light close-card" title="Fechar">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <iframe src="https://bombeiros.pt/ocorrencias/ocorrencias.html"
                        class="w-100 border-0"
                        style="height: 600px;"
                        title="Ocorrências Bombeiros"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                        referrerpolicy="no-referrer">
                </iframe>
            </div>
            <div class="card-footer text-muted small">
                Fonte: <a href="https://bombeiros.pt" target="_blank">bombeiros.pt</a>
            </div>
        </div>
    </div>

    <!-- 4. IPMA - Perigo de Incêndio Rural -->
    <div class="col-md-6 monitor-card" id="card-ipma">
        <div class="card h-100 shadow-sm">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-map me-2"></i> IPMA - Risco de Incêndio</span>
                <div>
                    <button class="btn btn-sm btn-light me-2 expand-card" title="Expandir">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                    <button class="btn btn-sm btn-light close-card" title="Fechar">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <iframe src="https://www.ipma.pt/pt/riscoincendio/"
                        class="w-100 border-0"
                        style="height: 600px;"
                        title="Risco de Incêndio"
                        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
                        referrerpolicy="no-referrer">
                </iframe>
            </div>
            <div class="card-footer text-muted small">
                Fonte: <a href="https://www.ipma.pt" target="_blank">ipma.pt</a>
            </div>
        </div>
    </div>
</div>

<!-- Botões para reabrir cartões fechados (inicialmente ocultos) -->
<div class="row mt-4" id="reopen-buttons" style="display: none;">
    <div class="col text-center">
        <button class="btn btn-secondary me-2" id="reopen-fogos">Mostrar Fogos.pt</button>
        <button class="btn btn-secondary me-2" id="reopen-fogos-online">Mostrar fogos.online</button>
        <button class="btn btn-secondary me-2" id="reopen-bombeiros">Mostrar Bombeiros.pt</button>
        <button class="btn btn-secondary" id="reopen-ipma">Mostrar IPMA</button>
    </div>
</div>

<!-- Modais de Ecrã Inteiro -->
<div class="modal fade modal-fullscreen" id="modalExpand" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Janela Expandida</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <iframe id="fullscreenIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Lógica para Expandir (Modal) ---
    document.querySelectorAll('.expand-card').forEach(button => {
        button.addEventListener('click', function() {
            const card = this.closest('.card');
            const iframe = card.querySelector('iframe');
            const iframeSrc = iframe.src;
            document.getElementById('fullscreenIframe').src = iframeSrc;
            const modalTitle = card.querySelector('.card-header span').innerText;
            document.querySelector('#modalExpand .modal-title').innerText = modalTitle;
            new bootstrap.Modal(document.getElementById('modalExpand')).show();
        });
    });
    // Limpar o src do iframe ao fechar o modal, para parar carregamentos
    document.getElementById('modalExpand').addEventListener('hidden.bs.modal', function () {
        document.getElementById('fullscreenIframe').src = '';
    });

    // --- Lógica para Fechar Cartão ---
    const reopenButtonsDiv = document.getElementById('reopen-buttons');
    let closedCards = {};

    document.querySelectorAll('.close-card').forEach(button => {
        button.addEventListener('click', function() {
            const cardDiv = this.closest('.monitor-card');
            const cardId = cardDiv.id;
            if (cardId) {
                closedCards[cardId] = true;
                cardDiv.classList.add('card-closed');
                reopenButtonsDiv.style.display = 'block';
            }
        });
    });

    // --- Lógica para Reabrir Cartão ---
    document.getElementById('reopen-fogos').addEventListener('click', () => reopenCard('card-fogos'));
    document.getElementById('reopen-fogos-online').addEventListener('click', () => reopenCard('card-fogos-online'));
    document.getElementById('reopen-bombeiros').addEventListener('click', () => reopenCard('card-bombeiros'));
    document.getElementById('reopen-ipma').addEventListener('click', () => reopenCard('card-ipma'));

    function reopenCard(cardId) {
        const card = document.getElementById(cardId);
        if (card) {
            card.classList.remove('card-closed');
            delete closedCards[cardId];
            if (Object.keys(closedCards).length === 0) {
                reopenButtonsDiv.style.display = 'none';
            }
        }
    }

    // --- Lógica para Filtrar o fogos.pt para Portalegre ---
    const fogosFrame = document.getElementById('fogosFrame');
    document.querySelector('.filter-portalegre')?.addEventListener('click', () => {
        // Tenta pesquisar por 'Portalegre' no site do fogos.pt
        if (fogosFrame) {
            fogosFrame.src = 'https://www.fogos.pt/?s=Portalegre#gsc.tab=0&gsc.q=Portalegre';
        }
    });
    document.querySelector('.reset-map')?.addEventListener('click', () => {
        if (fogosFrame) {
            fogosFrame.src = 'https://www.fogos.pt';
        }
    });
</script>

{% endblock %}
