<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Lista de Checklists</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        @media print { body { margin: 15px; } }
    </style>
</head>
<body>
    <h2>Lista de Checklists</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Viatura</th>
                <th>Efetuado por</th>
                <th>Finalizado</th>
            </tr>
        </thead>
        <tbody>
            {% for c in checklists %}
            <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.data_hora.strftime('%d/%m/%Y %H:%M') }}</td>
                <td>{{ c.viatura.matricula }}</td>
                <td>{{ c.bombeiro.nome }}</td>
                <td>{{ 'Sim' if c.finalizado else 'Não' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>window.print();</script>
</body>
</html>
